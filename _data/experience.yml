# IPGP
- company: IPGP &mdash; Paris Institute of Globe Physics
  url: https://www.ipgp.fr/en/
  logo: images/ipgp-logo.svg
  roles:
    - position: Head of Space Magnetometry Data Processing &mdash; Research Engineer (permanent)
      duration: Dec, 2024 &mdash; Now
      summary: Lead of the Payload Data Ground Segment of ESA's <a href="https://nanomagsat.fr/" target="_blank">NanoMagSat</a> Scout mission (three nanosatellites), while overseeing Swarm data production.
      highlights:
        - Processing chains and End-to-End simulations for every instrument, with the Open Cosmos-led consortium
        - Ground segment planning, budget and ESA documentation; management of a team of research engineers

    - position: Technical Lead, Space Data Processing
      duration: Oct, 2022 &mdash; Nov, 2024
      summary: Technical lead for all space data processing of the Geomagnetism team.
      highlights:
        - Four Swarm Level-2 products (geomagnetic field models) developed and delivered to ESA, with OPGC and NOAA
        - Contribution to geomagnetic field models (DGRF 2020 / IGRF-14 candidate, DIFI daily variations); hiring and training of research engineers

    - position: Scientific Computing Expert &mdash; Swarm ASM data
      duration: Mar, 2021 &mdash; Sep, 2022
      summary: Owner of the Level-1B and Level-2 data of the Absolute Scalar Magnetometer (CEA-Leti, CNES) on board the three satellites of ESA's <a href="https://earth.esa.int/eogateway/missions/swarm" target="_blank">Swarm</a> mission.
      highlights:
        - Three production and validation chains, with bimonthly deliveries and reports to ESA
        - Data quality tools presented at ESA Swarm Data Quality Workshops

