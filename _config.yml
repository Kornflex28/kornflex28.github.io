include:
 - _pages

# Site settings
url: "https://touchevisual.dev"
lang: en
title: "Louis Chauvet"
description: "Louis Chauvet, research engineer at IPGP in Paris, leads space magnetometry data processing for ESA's Swarm and NanoMagSat missions."
tagline: "Research engineer at Paris Institute of Globe Physics"

# Link previews (jekyll-seo-tag): the castle card, which an image shows large
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /images/social-card.jpg
        width: 1200
        height: 630
        alt: "Louis Chauvet, in front of a castle of turrets and terraces"

# Build settings
markdown: kramdown
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
sass:
  sass_dir: _sass
  style: compressed
  sourcemap: development

# Resume settings
resume_name:                    "Louis Chauvet"
resume_title:                   "Research Engineer &mdash; Head of Space Magnetometry Data Processing at IPGP"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "louis@touchevisual.dev"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       ""
resume_contact_address:         "Paris"

# What I know about, for search engines (_includes/profile-data.html)
resume_knows_about: [Geomagnetism, Space mission data processing, Ground segments, Scientific computing, Signal processing]

resume_header_intro: "<p>Research engineer in scientific computing at the <a href='https://www.ipgp.fr/en/' target='_blank'>Paris Institute of Globe Physics (IPGP)</a>, where I lead the processing of data from ESA magnetometry missions: <a href='https://earth.esa.int/eogateway/missions/swarm' target='_blank'><b>Swarm</b></a>, three satellites measuring the Earth's magnetic field since 2013, and the ground segment of the upcoming <a href='https://nanomagsat.fr/' target='_blank'><b>NanoMagSat</b></a> constellation of three nanosatellites. Graduate engineer from IMT Atlantique (signal processing, space telecommunications) and ISAE-Supaero.</p>"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_publications:    true
resume_section_education:       true
resume_section_skills:          true
resume_section_associations:    true
resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/Kornflex28"
  # resume_twitter_url:           ""
  # resume_dribbble_url:          ""
  # resume_facebook_url:          ""
  resume_linkedin_url:          "https://www.linkedin.com/in/louisc20171023/"
  resume_orcid_url:             "https://orcid.org/0000-0002-1467-9136"
  # resume_instagram_url:         ""
  # resume_website_url:           ""
  resume_frogs_url:           "/frogs"
  # resume_medium_url:            ""

# Note: when editing locally, remember to restart
# your Jekyll server when you edit this file. Changes
# to _config.yml are only recognized when the server starts

# Not published on the site. Jekyll 4 keeps its default excludes on top of these.
exclude:
  - README.md
  - LICENSE
  - assets/icons.ai
  - assets/resume-web-template.sketch
