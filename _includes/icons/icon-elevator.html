<!-- Round elevator capsule, hanging from the shaft that is its cable (elevator.js): original
     minimal drawing, shaded as a cylinder and painted with the same gouache-like texture as
     the castle (skyline.js) -->
<svg class="cabin-icon" viewBox="0 4 28 42" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="cabin-shade">
      <stop offset="0" class="shade-dark" stop-opacity="0.22" />
      <stop offset="0.28" class="shade-light" stop-opacity="0.35" />
      <stop offset="0.5" class="shade-light" stop-opacity="0" />
      <stop offset="0.52" class="shade-dark" stop-opacity="0" />
      <stop offset="1" class="shade-dark" stop-opacity="0.45" />
    </linearGradient>
    <radialGradient id="cabin-glass" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" class="shade-light" stop-opacity="0.6" />
      <stop offset="0.45" class="shade-light" stop-opacity="0" />
      <stop offset="0.5" class="shade-dark" stop-opacity="0" />
      <stop offset="1" class="shade-dark" stop-opacity="0.35" />
    </radialGradient>
    <radialGradient id="cabin-light">
      <stop offset="0" class="glow" stop-opacity="0.8" />
      <stop offset="1" class="glow" stop-opacity="0" />
    </radialGradient>
    <filter id="cabin-gouache" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7 0.35" numOctaves="3" seed="7" result="fine" />
      <feColorMatrix in="fine" type="saturate" values="0" result="grey" />
      <feComponentTransfer in="grey" result="mottle">
        <feFuncR type="linear" slope="0.7" intercept="0.56" />
        <feFuncG type="linear" slope="0.7" intercept="0.56" />
        <feFuncB type="linear" slope="0.7" intercept="0.56" />
        <feFuncA type="linear" slope="0" intercept="1" />
      </feComponentTransfer>
      <feComposite in="SourceGraphic" in2="mottle" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" />
    </filter>
  </defs>
  <g class="outline thin" filter="url(#cabin-gouache)">
    <path class="c-slate" d="M3 30 L0.5 38 V41 L4.5 37 Z" />
    <path class="c-slate" d="M25 30 L27.5 38 V41 L23.5 37 Z" />
    <path class="c-slate" d="M14 5 C6 5 4 13 4 21 V30 C4 37 9 41 14 44 C19 41 24 37 24 30 V21 C24 13 22 5 14 5 Z" />
    <path class="shade" fill="url(#cabin-shade)" stroke="none" d="M14 5 C6 5 4 13 4 21 V30 C4 37 9 41 14 44 C19 41 24 37 24 30 V21 C24 13 22 5 14 5 Z" />
    <circle class="porthole-glow" fill="url(#cabin-light)" stroke="none" cx="14" cy="21" r="9" />
    <circle class="c-cream porthole" cx="14" cy="21" r="5" />
    <circle class="shade" fill="url(#cabin-glass)" stroke="none" cx="14" cy="21" r="5" />
    <circle class="c-red" cx="14" cy="21" r="2.25" />
  </g>
</svg>
