name: Check the links

# Every Monday, every link of the built site tried (the articles, the profiles, the pages
# themselves): those that no longer answer are listed in an issue, opened, or brought up to
# date if one is already open, and closed once they all answer again. Sites that turn robots
# away (403, 429, LinkedIn's 999) count as answering; slow ones get two minutes. The datasets'
# DOIs (10.18715) are left out: they resolve at once, but to the IPGP data repository, which
# takes from half a minute to over two to answer, so they would always look broken.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 120
            --accept 200..=299,403,429,999
            --root-dir ${{ github.workspace }}/_site
            --fallback-extensions html
            --exclude-path _site/card.html
            --exclude '^https://doi\.org/10\.18715/'
            '_site/**/*.html'
          output: ${{ runner.temp }}/links.md
          fail: false
      - id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label links --state open --json number --jq '.[0].number')" >> "$GITHUB_OUTPUT"
      - if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links on the site
          content-filepath: ${{ runner.temp }}/links.md
          labels: links
          issue-number: ${{ steps.open.outputs.number }}
      - if: steps.lychee.outputs.exit_code == 0 && steps.open.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ steps.open.outputs.number }}" --repo "$GITHUB_REPOSITORY" --comment "Every link answers again."
