name: Check the links

# Every Monday, every link of the built site tried (the articles, the profiles, the pages
# themselves): those that no longer answer are listed in an issue, opened, or brought up to
# date if one is already open. Publishers that turn robots away (403, 429) count as answering.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 30
            --accept 200..=299,403,429
            --root-dir ${{ github.workspace }}/_site
            --exclude-path _site/card.html
            '_site/**/*.html'
          output: ${{ runner.temp }}/links.md
          fail: false
      - id: open
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label links --state open --json number --jq '.[0].number')" >> "$GITHUB_OUTPUT"
      - if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links on the site
          content-filepath: ${{ runner.temp }}/links.md
          labels: links
          issue-number: ${{ steps.open.outputs.number }}
