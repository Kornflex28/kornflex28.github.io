name: Build and deploy site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # every morning, published again: a castle of the day for the link previews and the README
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v6
      - run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      # the Python the pictures below are taken and compared with
      - name: Set up the picture tools
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow websocket-client
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      # The pages opened as a visitor would, by a headless Chrome: the publication stops if a
      # script fails, or if what the scripts draw is not there (the castle and its sky, the
      # floors' drawings, the castle's ID, the frog)
      - name: Check the pages draw
        run: |
          python3 -m http.server 8001 --directory _site > /dev/null 2>&1 &
          sleep 1
          check() {
            page="$1"; shift
            google-chrome --headless=new --enable-logging=stderr --v=0 --virtual-time-budget=8000 \
              --dump-dom "http://localhost:8001$page" > "$RUNNER_TEMP/dom.html" 2> "$RUNNER_TEMP/log.txt"
            if grep "Uncaught" "$RUNNER_TEMP/log.txt"; then echo "::error::a script fails on $page"; exit 1; fi
            for mark in "$@"; do
              grep -q -- "$mark" "$RUNNER_TEMP/dom.html" || { echo "::error::$mark missing on $page"; exit 1; }
            done
          }
          check / 'data-moment=' 'class="floor-deco' 'id="castle-id"'
          check /frogs 'canvas-frog'
          check /404.html 'lost-ruins'
      # A new castle for link previews at each publication: a headless Chrome photographs
      # the card page, and the picture replaces the card kept in the repository. If anything
      # fails, that card stays.
      - name: Draw the link preview card
        continue-on-error: true
        run: |
          python3 -m http.server 8000 --directory _site > /dev/null 2>&1 &
          sleep 1
          google-chrome --headless=new --hide-scrollbars --window-size=1200,630 \
            --virtual-time-budget=8000 --screenshot="$RUNNER_TEMP/card.png" http://localhost:8000/card.html
          python -c "import sys; from PIL import Image; Image.open(sys.argv[1]).convert('RGB').save(sys.argv[2], quality=88)" \
            "$RUNNER_TEMP/card.png" _site/images/social-card.jpg
      # A gallery of castles at each publication (castles/index.html): two dozen drawn at random
      # and photographed, and an animation going through them for the README
      - name: Photograph a gallery of castles
        continue-on-error: true
        run: |
          python3 -m http.server 8002 --directory _site > /dev/null 2>&1 &
          sleep 1
          python .github/scripts/gallery.py _site 24 http://localhost:8002
      - uses: actions/upload-pages-artifact@v5

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
